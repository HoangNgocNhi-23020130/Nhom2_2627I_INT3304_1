name: 🏆 Auto Bot Tournament & Leaderboard

on:
  push:
    paths:
      - 'BT3/bots/**'
      - '.github/workflows/tournament.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'BT3/bots/**'
    branches:
      - main
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng 1 nút bấm trên GitHub

jobs:
  tournament:
    name: ⚔️ Chạy Giải Đấu & Cập Nhật BXH
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Tải mã nguồn repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Kiểm tra trình biên dịch C++ (clang++ / g++)
        run: |
          clang++ --version || g++ --version

      - name: ⚔️ Chạy Giải Đấu Tự Động (Double Round-Robin)
        run: |
          cd BT3
          python3 run_tournament.py --timeout 0.2

      - name: 🚀 Tự động Commit & Push BXH + Replay mới lên GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Chỉ add các file kết quả giải đấu
          git add BT3/leaderboard.html BT3/replays/
          
          if git diff --staged --quiet; then
            echo "🟢 Không có thay đổi nào trong bảng xếp hạng."
          else
            git commit -m "chore(ci): Auto-update tournament leaderboard & replays [skip ci]"
            git push origin main
            echo "🎉 Đã cập nhật Bảng Xếp Hạng và Replays mới lên GitHub thành công!"
          fi
